name: Deploy cafe kiosk to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "kiosk/**"
      - ".github/workflows/deploy-kiosk-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test kiosk
        run: npm --prefix kiosk test

      - name: Check JavaScript syntax
        run: npm --prefix kiosk run check

      - name: Build static site
        run: sh kiosk/scripts/build-static.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kiosk/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
