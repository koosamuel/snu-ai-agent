<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="의류·잡화 판매 데이터를 분석하는 정적 대시보드">
  <title>의류·잡화 판매 분석</title>
  <link rel="stylesheet" href="./styles.css?v=20260929-3">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Sales Data Analysis</p>
      <h1 data-i18n="title">의류·잡화 판매 대시보드</h1>
      <p id="connectionStatus" class="status">샘플 데이터 불러오는 중</p>
    </div>
    <div class="header-actions">
      <div class="language-control">
        <label for="language" data-i18n="language">언어</label>
        <select id="language" aria-label="언어 선택">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>
      <form id="uploadForm" class="upload">
        <label for="file" data-i18n="addCsv">CSV 추가</label>
        <input id="file" type="file" accept=".csv" required>
        <button type="submit" data-i18n="applyData">데이터 반영</button>
      </form>
      <form id="loginForm" class="login" hidden>
        <label for="email" data-i18n="operatorLogin">운영자 로그인</label>
        <input id="email" type="email" placeholder="email@example.com" required>
        <input id="password" type="password" placeholder="비밀번호" data-i18n-placeholder="password" required>
        <button type="submit" data-i18n="login">로그인</button>
        <button id="logoutButton" class="secondary" type="button" data-i18n="logout" hidden>로그아웃</button>
      </form>
    </div>
  </header>

  <p id="message" class="banner" hidden></p>

  <main>
    <section class="kpis" aria-label="핵심 지표" data-i18n-aria="kpis">
      <article><p data-i18n="totalSales">총 매출</p><strong id="totalSales">-</strong></article>
      <article><p data-i18n="totalQty">판매 수량</p><strong id="totalQty">-</strong></article>
      <article><p data-i18n="orderCount">거래 건수</p><strong id="orderCount">-</strong></article>
      <article><p data-i18n="avgOrder">건당 평균</p><strong id="avgOrder">-</strong></article>
      <article><p data-i18n="dataSource">데이터 출처</p><strong id="sourceCount">-</strong></article>
    </section>

    <section class="charts">
      <article>
        <h2 data-i18n="monthlySales">월별 매출</h2>
        <div class="chart-frame"><canvas id="monthlyChart"></canvas></div>
      </article>
      <article>
        <h2 data-i18n="categorySales">카테고리별 매출</h2>
        <div class="chart-frame"><canvas id="categoryChart"></canvas></div>
      </article>
    </section>

    <section class="panel">
      <h2 data-i18n="recentTransactions">최근 거래</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="date">날짜</th><th data-i18n="category">카테고리</th><th data-i18n="product">상품</th><th data-i18n="quantity">수량</th><th data-i18n="unitPrice">단가</th><th data-i18n="sales">매출</th><th data-i18n="store">매장</th><th data-i18n="channel">채널</th>
            </tr>
          </thead>
          <tbody id="salesRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer">GitHub Pages 정적 화면 · Supabase 인증·저장·실시간 동기화</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js?v=20260929-3"></script>
</body>
</html>
